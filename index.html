<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathSculpt — printable surfaces from formulas</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span id="brand">MathSculpt</span>
        <select id="presetSel"></select>
        <button id="saveBtn" class="tb-btn" title="Save current state as a user preset">💾 Save</button>
        <button id="shareBtn" class="tb-btn" title="Copy share link">🔗 Share</button>
        <button id="undoBtn" class="tb-btn" title="Undo (Ctrl/Cmd+Z)" disabled>↩️ Undo</button>
        <button id="redoBtn" class="tb-btn" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↪️ Redo</button>
        <span class="tb-spacer"></span>
        <button id="exportBtn" class="tb-btn primary">Export STL</button>
      </header>
      <div id="content">
        <aside id="panel">
          <section class="card">
            <h2>Shape</h2>
            <div id="shapeControls"></div>
            <div id="exportControls"></div>
            <canvas id="profileGraph"></canvas>
          </section>
          <div id="carrierCards"></div>
          <h3 class="group-title">Displacements</h3>
          <div id="displaceCards"></div>
          <h3 class="group-title">Deformers</h3>
          <div id="deformCards"></div>
          <div id="modCard"></div>
          <p id="status"></p>
          <p id="warnings"></p>
        </aside>
        <main id="viewWrap">
          <canvas id="view"></canvas>
          <div id="progressWrap" hidden>
            <div id="progressBar"><div id="progressFill"></div></div>
            <span id="progressLabel"></span>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
